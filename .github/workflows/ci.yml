name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit & Determinism Tests
        run: go test -v -count=1 ./...

      - name: Run SSE & Matcher Benchmarks Smoke Check
        run: go test -bench=Benchmark -benchmem -benchtime=100ms -run=NONE ./pkg/cassette ./pkg/matcher

      - name: Compile CLI Binary
        run: go build -v -ldflags="-s -w -X main.Version=v1.2.1" ./cmd/agentfixture
