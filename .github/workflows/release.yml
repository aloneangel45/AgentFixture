name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Verification Suite
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Build Multi-Platform Binaries
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME:-v1.2.1}

          # Windows amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${VERSION}" -o dist/agentfixture.exe ./cmd/agentfixture
          cd dist && zip agentfixture-windows-amd64.zip agentfixture.exe && rm agentfixture.exe && cd ..

          # Windows arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="-s -w -X main.Version=${VERSION}" -o dist/agentfixture.exe ./cmd/agentfixture
          cd dist && zip agentfixture-windows-arm64.zip agentfixture.exe && rm agentfixture.exe && cd ..

          # Linux amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${VERSION}" -o dist/agentfixture ./cmd/agentfixture
          tar -czvf dist/agentfixture-linux-amd64.tar.gz -C dist agentfixture
          rm dist/agentfixture

          # Linux arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.Version=${VERSION}" -o dist/agentfixture ./cmd/agentfixture
          tar -czvf dist/agentfixture-linux-arm64.tar.gz -C dist agentfixture
          rm dist/agentfixture

          # macOS amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${VERSION}" -o dist/agentfixture ./cmd/agentfixture
          tar -czvf dist/agentfixture-darwin-amd64.tar.gz -C dist agentfixture
          rm dist/agentfixture

          # macOS arm64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.Version=${VERSION}" -o dist/agentfixture ./cmd/agentfixture
          tar -czvf dist/agentfixture-darwin-arm64.tar.gz -C dist agentfixture
          rm dist/agentfixture

          # Checksums
          cd dist
          sha256sum *.zip *.tar.gz > checksums.txt
          cd ..

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agentfixture-windows-amd64.zip
            dist/agentfixture-windows-arm64.zip
            dist/agentfixture-linux-amd64.tar.gz
            dist/agentfixture-linux-arm64.tar.gz
            dist/agentfixture-darwin-amd64.tar.gz
            dist/agentfixture-darwin-arm64.tar.gz
            dist/checksums.txt
          generate_release_notes: true
